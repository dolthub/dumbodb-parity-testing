name: Parity Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_RS_URI: mongodb://localhost:27019/?replicaSet=rs0
      DUMBODB_URI: mongodb://localhost:27018
      DUMBODB_DATA_DIR: /tmp/dumbodb-data
      DOLT_URI: "root:@tcp(localhost:3306)/"
      DOLT_DATA_DIR: /tmp/dolt-data
      # Cap TestStorageParity_Scale at 100k docs in CI. The full
      # sweep (10k -> 10M) takes hours; a manual run does the whole
      # matrix by default. Drop or raise this to widen CI coverage.
      STORAGE_PARITY_MAX_DOCS: "100000"

    steps:
      - uses: actions/checkout@v4

      - name: Start replica-set MongoDB on :27019
        run: |
          # Multi-document transactions require a replica set. Standalone
          # Mongo on :27017 keeps non-transactional tests at parity (see
          # harness.Topology). Tests requiring transactions declare
          # TopologyReplicaSet and route to this instance.
          docker run -d --name mongo-rs --network host \
            mongo:8.0 mongod --replSet rs0 --bind_ip_all --port 27019
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --port 27019 --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-rs mongosh --port 27019 --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27019"}]})'
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --port 27019 --quiet --eval \
                'if (db.runCommand({hello:1}).primary) quit(0); else quit(1)' >/dev/null 2>&1; then
              echo "Replica set primary elected"
              break
            fi
            sleep 2
          done

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build DumboDB
        env:
          DUMBODB_COMMIT: ${{ vars.DUMBODB_COMMIT || 'main' }}
          # This PR/push branch; a same-named dumbodb branch (a parallel PR) is
          # preferred over main unless DUMBODB_COMMIT is explicitly overridden.
          CANDIDATE: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --depth 1 https://x:${{ secrets.DUMBODB_READ_TOKEN }}@github.com/dolthub/dumbodb.git /tmp/dumbodb
          cd /tmp/dumbodb

          target="$DUMBODB_COMMIT"
          if [ "$target" = "main" ] && [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "main" ] && \
             git ls-remote --exit-code --heads origin "refs/heads/${CANDIDATE}" >/dev/null 2>&1; then
            target="$CANDIDATE"
            echo "Matching dumbodb branch found: ${CANDIDATE}"
          fi

          if [ -n "$target" ] && [ "$target" != "main" ]; then
            git fetch --depth 1 origin "$target"
            git checkout "$target"
            echo "Building dumbodb from: ${target}"
          else
            echo "Building dumbodb from: main"
          fi

          # Build the dumbodb binary (adjust path if the repo layout differs)
          go build -o /usr/local/bin/dumbodb ./cmd/dumbodb

      - name: Start DumboDB
        run: |
          dumbodb --port 27018 --data-dir /tmp/dumbodb-data > /tmp/dumbodb.log 2>&1 &
          echo $! > /tmp/dumbodb.pid

      - name: Wait for DumboDB to be ready
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 27018 2>/dev/null; then
              echo "DumboDB ready"
              exit 0
            fi
            # Bail early if dumbodb process has already died
            if ! kill -0 $(cat /tmp/dumbodb.pid) 2>/dev/null; then
              echo "DumboDB process died:" >&2
              cat /tmp/dumbodb.log >&2
              exit 1
            fi
            echo "Waiting for DumboDB ($i/30)..."
            sleep 2
          done
          echo "DumboDB did not start in time. Log:" >&2
          cat /tmp/dumbodb.log >&2
          exit 1

      - name: Install Dolt
        run: |
          # The ./storage parity tests drive a live dolt sql-server. Pull
          # the latest release binary rather than `go install` to match a
          # tagged build and avoid surprise toolchain bumps.
          DOLT_VERSION=$(curl -sSL https://api.github.com/repos/dolthub/dolt/releases/latest \
            | grep -m1 '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          echo "Installing dolt v${DOLT_VERSION}"
          curl -sSL "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/dolt-linux-amd64.tar.gz" \
            -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo mv /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version

      - name: Start Dolt sql-server
        run: |
          mkdir -p "$DOLT_DATA_DIR"
          # Committer identity is required for CALL DOLT_COMMIT.
          dolt config --global --add user.email "parity-ci@dolthub.local"
          dolt config --global --add user.name  "parity-ci"
          (cd "$DOLT_DATA_DIR" && dolt sql-server --host 0.0.0.0 --port 3306) \
            > /tmp/dolt.log 2>&1 &
          echo $! > /tmp/dolt.pid

      - name: Wait for Dolt sql-server to be ready
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "Dolt sql-server ready"
              exit 0
            fi
            if ! kill -0 $(cat /tmp/dolt.pid) 2>/dev/null; then
              echo "Dolt sql-server process died:" >&2
              cat /tmp/dolt.log >&2
              exit 1
            fi
            echo "Waiting for Dolt sql-server ($i/30)..."
            sleep 2
          done
          echo "Dolt sql-server did not start in time. Log:" >&2
          cat /tmp/dolt.log >&2
          exit 1

      - name: Run parity suite
        run: |
          set -o pipefail
          mkdir -p results
          # pipefail propagates go test's non-zero exit through tee so a
          # single JSON-streamed run gates CI. The artifact uploaded below
          # carries the same data for post-hoc human inspection.
          go test ./... -v -timeout 15m -json | tee results/parity.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: results/
          if-no-files-found: ignore
