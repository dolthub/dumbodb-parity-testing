name: Parity Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest

    services:
      mongo:
        # Pinned to the MongoDB release DumboDB is tested against; keep in
        # sync with the mongo-rs image below, the apt install step, dumbodb's
        # internal/version MongoDBVersion, and the README.
        image: mongo:8.0.28
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_RS_URI: mongodb://localhost:27019/?replicaSet=rs0
      DUMBODB_URI: mongodb://localhost:27018
      # The harness spawns the access-control-enabled pair from these binaries;
      # the servers above cover the non-auth and replica-set roles.
      MONGOD_BIN: /usr/bin/mongod
      DUMBODB_BIN: /usr/local/bin/dumbodb
      DUMBODB_DATA_DIR: /tmp/dumbodb-data
      DOLT_URI: "root:@tcp(localhost:3306)/"
      DOLT_DATA_DIR: /tmp/dolt-data
      # Cap TestStorageParity_Scale at 100k docs in CI. The full
      # sweep (10k -> 10M) takes hours; a manual run does the whole
      # matrix by default. Drop or raise this to widen CI coverage.
      STORAGE_PARITY_MAX_DOCS: "100000"

    steps:
      - uses: actions/checkout@v6

      - name: Start replica-set MongoDB on :27019
        run: |
          # Multi-document transactions require a replica set. Standalone
          # Mongo on :27017 keeps non-transactional tests at parity (see
          # harness.Topology). Tests requiring transactions declare
          # TopologyReplicaSet and route to this instance.
          docker run -d --name mongo-rs --network host \
            mongo:8.0.28 mongod --replSet rs0 --bind_ip_all --port 27019
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --port 27019 --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-rs mongosh --port 27019 --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27019"}]})'
          for i in $(seq 1 30); do
            if docker exec mongo-rs mongosh --port 27019 --quiet --eval \
                'if (db.runCommand({hello:1}).primary) quit(0); else quit(1)' >/dev/null 2>&1; then
              echo "Replica set primary elected"
              break
            fi
            sleep 2
          done

      - uses: actions/setup-go@v6
        with:
          # Must be at least the go directive in dumbodb's go.mod, which the
          # Build DumboDB step compiles. setup-go sets GOTOOLCHAIN=local, so a
          # version older than dumbodb requires fails instead of upgrading.
          go-version: "1.26.7"
          cache: true

      - name: Build DumboDB
        env:
          # This PR/push branch; when a same-named dumbodb branch exists (a
          # parallel PR) build from it, otherwise build from main.
          CANDIDATE: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --depth 1 https://x:${{ secrets.DUMBODB_READ_TOKEN }}@github.com/dolthub/dumbodb.git /tmp/dumbodb
          cd /tmp/dumbodb

          if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "main" ] && \
             git ls-remote --exit-code --heads origin "refs/heads/${CANDIDATE}" >/dev/null 2>&1; then
            echo "Building dumbodb from matching branch: ${CANDIDATE}"
            git fetch --depth 1 origin "$CANDIDATE"
            # The shallow clone has no local ref for the fetched branch, so
            # check out the fetched commit directly.
            git checkout FETCH_HEAD
          else
            echo "Building dumbodb from: main"
          fi

          # Build the dumbodb binary (adjust path if the repo layout differs)
          go build -o /usr/local/bin/dumbodb ./cmd/dumbodb

      - name: Install mongod binary
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${codename}/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          # Pin to the same release as the mongo service image above.
          sudo apt-get install -y mongodb-org-server=8.0.28
          mongod --version

      - name: Start DumboDB
        run: |
          dumbodb --port 27018 --data-dir /tmp/dumbodb-data > /tmp/dumbodb.log 2>&1 &
          echo $! > /tmp/dumbodb.pid

      - name: Wait for DumboDB to be ready
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 27018 2>/dev/null; then
              echo "DumboDB ready"
              exit 0
            fi
            # Bail early if dumbodb process has already died
            if ! kill -0 $(cat /tmp/dumbodb.pid) 2>/dev/null; then
              echo "DumboDB process died:" >&2
              cat /tmp/dumbodb.log >&2
              exit 1
            fi
            echo "Waiting for DumboDB ($i/30)..."
            sleep 2
          done
          echo "DumboDB did not start in time. Log:" >&2
          cat /tmp/dumbodb.log >&2
          exit 1

      - name: Install Dolt
        run: |
          # The ./storage parity tests drive a live dolt sql-server. Pull
          # the latest release binary rather than `go install` to match a
          # tagged build and avoid surprise toolchain bumps.
          DOLT_VERSION=$(curl -sSL https://api.github.com/repos/dolthub/dolt/releases/latest \
            | grep -m1 '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          echo "Installing dolt v${DOLT_VERSION}"
          curl -sSL "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/dolt-linux-amd64.tar.gz" \
            -o /tmp/dolt.tar.gz
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo mv /tmp/dolt-linux-amd64/bin/dolt /usr/local/bin/dolt
          dolt version

      - name: Start Dolt sql-server
        run: |
          mkdir -p "$DOLT_DATA_DIR"
          # Committer identity is required for CALL DOLT_COMMIT.
          dolt config --global --add user.email "parity-ci@dolthub.local"
          dolt config --global --add user.name  "parity-ci"
          (cd "$DOLT_DATA_DIR" && dolt sql-server --host 0.0.0.0 --port 3306) \
            > /tmp/dolt.log 2>&1 &
          echo $! > /tmp/dolt.pid

      - name: Wait for Dolt sql-server to be ready
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 3306 2>/dev/null; then
              echo "Dolt sql-server ready"
              exit 0
            fi
            if ! kill -0 $(cat /tmp/dolt.pid) 2>/dev/null; then
              echo "Dolt sql-server process died:" >&2
              cat /tmp/dolt.log >&2
              exit 1
            fi
            echo "Waiting for Dolt sql-server ($i/30)..."
            sleep 2
          done
          echo "Dolt sql-server did not start in time. Log:" >&2
          cat /tmp/dolt.log >&2
          exit 1

      - name: Run parity suite
        run: |
          set -o pipefail
          mkdir -p results
          # pipefail propagates go test's non-zero exit through tee so a
          # single JSON-streamed run gates CI. The artifact uploaded below
          # carries the same data for post-hoc human inspection.
          go test ./... -v -timeout 15m -json | tee results/parity.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-results
          path: results/
          if-no-files-found: ignore

  replication:
    # Separate from the parity job on purpose. These cases spawn their own
    # multi-member replica sets and take far longer than the 15m parity budget,
    # and a red replication suite must not obscure CRUD parity results while
    # replication is still being built out.
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"
          cache: true

      - name: Install mongod binary
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu ${codename}/mongodb-org/8.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          # 8.0.28 is the oracle the replication design document is written
          # against; the harness spawns its own sets from this binary.
          sudo apt-get install -y mongodb-org-server=8.0.28
          mongod --version

      - name: Build DumboDB
        env:
          CANDIDATE: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --depth 1 https://x:${{ secrets.DUMBODB_READ_TOKEN }}@github.com/dolthub/dumbodb.git /tmp/dumbodb
          cd /tmp/dumbodb

          if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "main" ] && \
             git ls-remote --exit-code --heads origin "refs/heads/${CANDIDATE}" >/dev/null 2>&1; then
            echo "Building dumbodb from matching branch: ${CANDIDATE}"
            git fetch --depth 1 origin "$CANDIDATE"
            git checkout FETCH_HEAD
          else
            echo "Building dumbodb from: main"
          fi

          # make build, not go build: the Makefile sets the -ldflags version
          # stamp that the binary reports through buildInfo.gitVersion. The
          # harness fails a run it cannot attribute to a commit, and a plain
          # go build reports "unknown".
          #
          # A shallow clone has no tags, so git describe falls back to "unknown"
          # too. Fetch them.
          git fetch --depth 1 origin +refs/tags/*:refs/tags/* 2>/dev/null || true
          make build
          sudo cp .runtime/bin/dumbodb /usr/local/bin/dumbodb

          # Refuse to run an unattributable binary rather than discover it in a
          # failing assertion later.
          reported=$(dumbodb --version | awk '{print $2}')
          echo "dumbodb reports: ${reported}"
          if [ -z "$reported" ] || [ "$reported" = "unknown" ]; then
            echo "dumbodb has no version stamp; results would not be attributable" >&2
            exit 1
          fi

      - name: Run replication suite
        env:
          MONGOD_BIN: /usr/bin/mongod
          DUMBODB_BIN: /usr/local/bin/dumbodb
        run: |
          set -o pipefail
          mkdir -p results
          # -tags replication selects the cases that spawn real replica sets;
          # without it they are excluded from the default build entirely.
          go test -tags replication ./harness/ ./tests/ \
            -v -timeout 80m -json | tee results/replication.json

      - name: Upload replication results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replication-results
          path: results/
          if-no-files-found: ignore

      - name: Dump server logs on failure
        if: failure()
        run: |
          # The member logs carry the reason a subject stopped replicating,
          # which the test output alone does not always show.
          for f in /tmp/dumbodb-member-*.log /tmp/mongod-*.log; do
            [ -f "$f" ] || continue
            echo "=============== $f ==============="
            tail -100 "$f"
          done
