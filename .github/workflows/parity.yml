name: Parity Suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017
      DOCUDOLT_URI: mongodb://localhost:27018

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build Docudolt
        env:
          DOCUDOLT_COMMIT: ${{ vars.DOCUDOLT_COMMIT || 'main' }}
        run: |
          git clone --depth 1 https://x:${{ secrets.DOCUDOLT_READ_TOKEN }}@github.com/dolthub/docudolt.git /tmp/docudolt
          cd /tmp/docudolt
          if [ -n "$DOCUDOLT_COMMIT" ] && [ "$DOCUDOLT_COMMIT" != "main" ]; then
            git fetch --depth 1 origin "$DOCUDOLT_COMMIT"
            git checkout "$DOCUDOLT_COMMIT"
          fi
          # Build the docudolt binary (adjust path if the repo layout differs)
          go build -o /usr/local/bin/docudolt ./cmd/docudolt

      - name: Start Docudolt
        run: |
          docudolt --port 27018 --data-dir /tmp/docudolt-data > /tmp/docudolt.log 2>&1 &
          echo $! > /tmp/docudolt.pid

      - name: Wait for Docudolt to be ready
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 27018 2>/dev/null; then
              echo "Docudolt ready"
              exit 0
            fi
            # Bail early if docudolt process has already died
            if ! kill -0 $(cat /tmp/docudolt.pid) 2>/dev/null; then
              echo "Docudolt process died:" >&2
              cat /tmp/docudolt.log >&2
              exit 1
            fi
            echo "Waiting for Docudolt ($i/30)..."
            sleep 2
          done
          echo "Docudolt did not start in time. Log:" >&2
          cat /tmp/docudolt.log >&2
          exit 1

      - name: Run parity suite
        run: |
          mkdir -p results
          go test ./... -v -timeout 15m -json | tee results/parity.json
          # Re-run without -json for human-readable output; ignore exit code (json run sets it)
          go test ./... -timeout 15m

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-results
          path: results/
          if-no-files-found: ignore
